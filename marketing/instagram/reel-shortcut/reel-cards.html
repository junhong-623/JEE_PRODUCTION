<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>JSave screenshot import Reel cards</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .card { position: relative; width: 1080px; height: 1920px; overflow: hidden; padding: 170px 88px 175px; color: #f8fff9; background: radial-gradient(circle at 86% 14%, #38a775, transparent 40%), radial-gradient(circle at 0% 90%, #146a51, transparent 45%), linear-gradient(155deg, #0b543f 4%, #0b3025 90%); }
    .card:before { content: ""; position: absolute; width: 1180px; height: 1180px; right: -500px; top: -280px; border: 2px solid rgba(255,255,255,.16); border-radius: 50%; }
    .brand { display: flex; align-items: center; gap: 20px; position: relative; z-index: 1; font-size: 42px; font-weight: 850; }
    .brand img { width: 82px; height: 82px; border-radius: 22px; }
    .eyebrow { position: relative; z-index: 1; margin-top: 235px; color: #f7d87b; font-size: 32px; font-weight: 900; letter-spacing: .12em; }
    h1 { position: relative; z-index: 1; margin: 34px 0 0; font-size: 130px; line-height: 1.14; letter-spacing: -.065em; }
    .sub { position: relative; z-index: 1; margin-top: 48px; max-width: 840px; color: #c4e5d2; font-size: 43px; line-height: 1.5; }
    .demo { position: absolute; left: 88px; right: 88px; bottom: 285px; padding: 40px 45px; border: 2px solid rgba(255,255,255,.35); border-radius: 34px; background: rgba(255,255,255,.13); font-size: 38px; font-weight: 800; }
    .demo b { color: #ffe18a; }
    .sticker { position: absolute; z-index: 2; top: 570px; right: 68px; transform: rotate(10deg); padding: 22px 30px; border-radius: 23px; background: #ffe18a; color: #114535; font-size: 39px; font-weight: 950; box-shadow: 0 17px 0 rgba(0,0,0,.12); }
    .foot { position: absolute; left: 88px; right: 88px; bottom: 170px; display: flex; justify-content: space-between; color: #b4dfc7; font-size: 27px; font-weight: 700; }
    .end { background: radial-gradient(circle at 16% 80%, #238861, transparent 47%), radial-gradient(circle at 80% 15%, #2c8068, transparent 50%), linear-gradient(155deg, #123b2b, #0d261e); }
    .end .eyebrow { margin-top: 270px; }
    .end h1 { font-size: 119px; }
    .end .cta { position: absolute; left: 88px; right: 88px; bottom: 325px; padding: 44px 48px; border-radius: 31px; color: #103327; background: #ddf8e4; font-size: 35px; line-height: 1.45; font-weight: 800; }
    .end .cta span { display: block; margin-top: 12px; color: #357156; font-size: 29px; }
  </style>
</head>
<body>
  <section class="card" id="opening">
    <div class="brand"><img src="../jsave-instagram-avatar.png" alt="" />JSave <span style="color:#a7dfbc;font-size:31px">/ J省</span></div>
    <div class="eyebrow">MALAYSIA · IPHONE 快捷指令</div>
    <h1>Aiyo，<br />又忘记<br />记账？</h1>
    <p class="sub">TNG / CIMB 截一张，<br />几下就 settle。</p>
    <div class="sticker">📸 截图就来</div>
    <div class="demo"><b>截图</b> → <b>选分类</b> → <b>确认</b></div>
    <div class="foot"><span>已适配的单笔交易</span><span>真实操作演示</span></div>
  </section>
  <section class="card end" id="closing">
    <div class="brand"><img src="../jsave-instagram-avatar.png" alt="" />JSave <span style="color:#a7dfbc;font-size:31px">/ J省</span></div>
    <div class="eyebrow">SETTLED ✓</div>
    <h1>这笔钱，<br />有交代了。</h1>
    <p class="sub">月底看账，不用再 blur。</p>
    <div class="cta">JSave → 设置 → 统一收据截图快捷指令<span>安装步骤在主页链接，跟着做就好 lah</span></div>
    <div class="foot"><span>免费使用</span><span>jsave.jeeprod.com</span></div>
  </section>
</body>
</html>
