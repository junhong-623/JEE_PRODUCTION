<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cheers.co 新订单通知</title>
</head>
<body style="margin:0;padding:0;background:#f0ead6;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f0ead6;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">

          <!-- Header -->
          <tr>
            <td align="center" style="background:#6B2D2D;border-radius:16px 16px 0 0;padding:32px 24px 24px;">
              <p style="margin:0;font-family:Georgia,serif;font-size:28px;font-weight:700;color:#F5F0A0;letter-spacing:0.02em;">Cheers.co</p>
              <p style="margin:8px 0 0;font-size:13px;color:rgba(245,240,160,0.65);letter-spacing:0.05em;text-transform:uppercase;">新订单通知</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="background:#ffffff;padding:0 24px 24px;">

              <!-- Order ID banner -->
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background:#FDFAE8;border:1.5px solid #F5F0A0;border-radius:10px;padding:14px 20px;margin-top:24px;display:block;">
                    <p style="margin:0;font-size:11px;color:#9a7a5a;text-transform:uppercase;letter-spacing:0.08em;">订单号</p>
                    <p style="margin:4px 0 0;font-size:20px;font-weight:700;color:#6B2D2D;font-family:Georgia,serif;letter-spacing:0.01em;">{{order_id}}</p>
                    <p style="margin:4px 0 0;font-size:12px;color:#b89a7a;">{{order_date}}</p>
                  </td>
                </tr>
              </table>

              <!-- Customer -->
              <table width="100%" cellpadding="0" cellspacing="0" style="margin-top:20px;">
                <tr>
                  <td>
                    <p style="margin:0 0 10px;font-size:12px;font-weight:600;color:#6B2D2D;text-transform:uppercase;letter-spacing:0.07em;">顾客资料</p>
                    <table width="100%" cellpadding="0" cellspacing="0" style="background:#FDFAE8;border-radius:10px;overflow:hidden;">
                      <tr>
                        <td style="padding:10px 16px;border-bottom:1px solid #F5F0A0;">
                          <span style="font-size:12px;color:#9a7a5a;">姓名</span><br/>
                          <span style="font-size:14px;font-weight:600;color:#4A1F1F;">{{customer_name}}</span>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:10px 16px;border-bottom:1px solid #F5F0A0;">
                          <span style="font-size:12px;color:#9a7a5a;">电话</span><br/>
                          <span style="font-size:14px;color:#4A1F1F;">{{customer_phone}}</span>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:10px 16px;">
                          <span style="font-size:12px;color:#9a7a5a;">电子邮件</span><br/>
                          <span style="font-size:14px;color:#4A1F1F;">{{customer_email}}</span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- Items -->
              <table width="100%" cellpadding="0" cellspacing="0" style="margin-top:20px;">
                <tr>
                  <td>
                    <p style="margin:0 0 10px;font-size:12px;font-weight:600;color:#6B2D2D;text-transform:uppercase;letter-spacing:0.07em;">商品明细</p>
                    <table width="100%" cellpadding="0" cellspacing="0" style="background:#FDFAE8;border-radius:10px;padding:14px 16px;">
                      <tr>
                        <td style="font-size:13px;color:#4A1F1F;line-height:1.9;white-space:pre-line;">{{order_items}}</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- Delivery -->
              <table width="100%" cellpadding="0" cellspacing="0" style="margin-top:20px;">
                <tr>
                  <td>
                    <p style="margin:0 0 10px;font-size:12px;font-weight:600;color:#6B2D2D;text-transform:uppercase;letter-spacing:0.07em;">配送方式</p>
                    <table width="100%" cellpadding="0" cellspacing="0" style="background:#FDFAE8;border-radius:10px;padding:14px 16px;">
                      <tr>
                        <td style="font-size:13px;color:#4A1F1F;line-height:1.6;">{{delivery_info}}</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- Total -->
              <table width="100%" cellpadding="0" cellspacing="0" style="margin-top:20px;">
                <tr>
                  <td style="background:#6B2D2D;border-radius:10px;padding:16px 20px;">
                    <table width="100%" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="font-size:14px;color:rgba(245,240,160,0.8);">订单总额</td>
                        <td align="right" style="font-size:22px;font-weight:700;color:#F5F0A0;font-family:Georgia,serif;">{{order_total}}</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="background:#f0ead6;border-radius:0 0 16px 16px;padding:20px 24px;">
              <p style="margin:0;font-size:12px;color:#b89a7a;">Cheers.co · 日本代购</p>
              <p style="margin:4px 0 0;font-size:11px;color:#c8ab8a;">此邮件由系统自动发送，请勿直接回复</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
