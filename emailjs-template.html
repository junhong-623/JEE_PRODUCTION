<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New message from jeeprod.com</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4ee;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #0d0d0d;
    }
    .wrapper {
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px 40px;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      border: 1px solid rgba(13,13,13,0.08);
      overflow: hidden;
    }
    .header {
      background: #0d0d0d;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e8440a;
      flex-shrink: 0;
    }
    .header-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(238,238,221,0.5);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }
    .header-title {
      font-size: 16px;
      color: #eeeedd;
      font-weight: 500;
      margin-top: 4px;
    }
    .body {
      padding: 32px;
    }
    .field {
      margin-bottom: 24px;
    }
    .field-label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(13,13,13,0.35);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      margin-bottom: 6px;
    }
    .field-value {
      font-size: 15px;
      color: #0d0d0d;
      line-height: 1.6;
      word-break: break-word;
    }
    .field-value a {
      color: #e8440a;
      text-decoration: none;
    }
    .message-box {
      background: #f9f9f4;
      border: 1px solid rgba(13,13,13,0.07);
      border-radius: 16px;
      padding: 18px 20px;
      font-size: 14px;
      line-height: 1.75;
      color: rgba(13,13,13,0.75);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .divider {
      height: 1px;
      background: rgba(13,13,13,0.07);
      margin: 28px 0;
    }
    .reply-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #0d0d0d;
      color: #eeeedd;
      border-radius: 9999px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }
    .footer {
      padding: 20px 32px;
      border-top: 1px solid rgba(13,13,13,0.06);
      background: #fafaf5;
    }
    .footer-text {
      font-size: 11px;
      color: rgba(13,13,13,0.3);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">

      <!-- Header -->
      <div class="header">
        <div class="header-dot"></div>
        <div>
          <div class="header-label">jeeprod.com — contact</div>
          <div class="header-title">New message</div>
        </div>
      </div>

      <!-- Body -->
      <div class="body">

        <div class="field">
          <span class="field-label">From</span>
          <div class="field-value">{{from_name}}</div>
        </div>

        <div class="field">
          <span class="field-label">Email</span>
          <div class="field-value">
            <a href="mailto:{{from_email}}">{{from_email}}</a>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Message</span>
          <div class="message-box">{{message}}</div>
        </div>

        <div class="divider"></div>

        <a href="mailto:{{from_email}}" class="reply-btn">Reply to {{from_name}}</a>

      </div>

      <!-- Footer -->
      <div class="footer">
        <p class="footer-text">Sent via jeeprod.com contact form</p>
      </div>

    </div>
  </div>
</body>
</html>
