name: Deploy to Firebase

on:
  push:
    branches: [main]

env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID }}
  VITE_LOCAL_PROJECTS: 'false'
  VITE_MATETRIP_VAPID_PUBLIC_KEY: ${{ secrets.VITE_MATETRIP_VAPID_PUBLIC_KEY }}
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
  VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
  VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
  VITE_EMAILJS_CONTACT_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_CONTACT_TEMPLATE_ID }}
  VITE_CHEERS_EMAILJS_SERVICE_ID: ${{ secrets.VITE_CHEERS_EMAILJS_SERVICE_ID }}
  VITE_CHEERS_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_CHEERS_EMAILJS_PUBLIC_KEY }}
  VITE_CHEERS_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_CHEERS_FIREBASE_MEASUREMENT_ID }}
  VITE_CHEERS_FIREBASE_APP_ID: ${{ secrets.VITE_CHEERS_FIREBASE_APP_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build main site
        run: npm run build

      - name: Build JSave standalone
        run: npm run build:jsave

      - name: Build MateTrip standalone
        run: npm run build:matetrip

      - name: Build Cheers standalone
        run: npm run build:cheers

      - name: Build H Agency standalone
        run: npm run build:hagency

      - name: Validate build artifacts
        run: |
          test -f dist/index.html || (echo "Missing dist/index.html" && exit 1)
          test -f dist-jsave/jsave.html || (echo "Missing dist-jsave/jsave.html" && exit 1)
          test -f dist-matetrip/matetrip.html || (echo "Missing dist-matetrip/matetrip.html" && exit 1)
          test -f dist-cheers/cheers.html || (echo "Missing dist-cheers/cheers.html" && exit 1)
          test -f dist-hagency/index.html || (echo "Missing dist-hagency/index.html" && exit 1)
          test -f dist-hagency/sitemap.xml || (echo "Missing dist-hagency/sitemap.xml" && exit 1)

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project jee-production --token "${{ secrets.FIREBASE_TOKEN }}"
