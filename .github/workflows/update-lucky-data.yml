name: Update Lucky Calc 4D data

on:
  schedule:
    # Daily at 10:15pm Malaysia time. Daily coverage also catches special draws.
    - cron: '15 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lucky-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build validated 4D history index
        run: npm run update:lucky-data

      - name: Run tests
        run: npm test

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/luck-calc/data
          if git diff --cached --quiet; then
            echo "No new 4D results."
          else
            git commit -m "data(lucky-calc): update 4D draw history"
            git push
          fi
